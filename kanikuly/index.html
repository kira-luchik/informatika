<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>До каникул</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=Nunito:wght@500;700;800&display=swap">
<style>[hidden]{display:none!important}body{margin:0}.home{position:relative;z-index:50;display:inline-block;margin:12px 0 0 max(16px,env(safe-area-inset-left,0px));font:700 13px system-ui,sans-serif;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;text-decoration:none}.home:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style>
<style>
/* Layout: departure board on a snowy night — giant countdown, then fun conversions in a strip, settings tucked at the bottom. Single night palette */
:root{
  color-scheme:dark;
  --bg:#0b1630; --bg2:#13244a; --ink:#eef4ff; --muted:#9fb2d6; --ice:#8fd3ff; --gold:#ffd36b; --tile:#152a55; --line:#24407a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed,var(--bg);color:var(--ink);font-family:var(--body)}
.home{background:rgba(255,255,255,.12)!important}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.eyebrow{font:800 13px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--ice)}
h1{font:900 clamp(30px,7vw,58px)/1.02 var(--display);margin:8px 0 0;text-wrap:balance}
h1 span{color:var(--gold)}
.date{color:var(--muted);font-weight:700;margin-top:8px}
.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);width:100%;max-width:760px}
.unit{background:var(--tile);border:1.5px solid var(--line);border-radius:18px;padding:clamp(12px,3vw,22px) 4px clamp(10px,2vw,16px);display:flex;flex-direction:column;gap:6px;min-width:0}
.unit b{font:800 clamp(34px,10vw,84px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.unit:first-child b{color:var(--gold)}
.unit small{font:800 clamp(11px,2.4vw,14px) var(--body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.fun{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:100%}
.f{background:rgba(21,42,85,.7);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.f b{font:800 24px var(--display);color:var(--ice);font-variant-numeric:tabular-nums}
.f span{color:var(--muted);font-weight:700;font-size:15px}
.party{font:900 clamp(40px,11vw,96px)/1 var(--display);color:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
details{width:100%;max-width:520px;color:var(--muted);text-align:left;background:rgba(21,42,85,.5);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:800}
.set{display:grid;gap:10px;margin-top:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.set input{font:700 16px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:800 15px var(--body);border:none;border-radius:999px;padding:9px 18px;cursor:pointer;background:var(--ice);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.party{animation:none}}
</style>
</head>
<body>
<a class="home" href="../">← На главную</a>
<canvas id="snow" aria-hidden="true"></canvas>
<main class="wrap">
  <div>
    <div class="eyebrow">Обратный отсчёт</div>
    <h1 id="title">До <span>каникул</span> осталось</h1>
    <div class="date" id="date"></div>
  </div>
  <div class="clock" id="clock" aria-live="off">
    <div class="unit"><b id="d">0</b><small id="dl">дней</small></div>
    <div class="unit"><b id="h">00</b><small id="hl">часов</small></div>
    <div class="unit"><b id="m">00</b><small id="ml">минут</small></div>
    <div class="unit"><b id="s">00</b><small id="sl">секунд</small></div>
  </div>
  <div class="party" id="party" hidden>Ура, каникулы!</div>
  <div class="fun" id="fun"></div>
  <details>
    <summary>Поменять дату или событие</summary>
    <form class="set" id="set">
      <label>Чего ждём<input id="evName" maxlength="40" placeholder="каникул"></label>
      <label>Дата<input id="evDate" type="date"></label>
      <div class="row"><button class="btn" type="submit">Сохранить</button><button class="btn ghost" type="button" id="reset">Вернуть каникулы 29 ноября</button></div>
    </form>
  </details>
</main>

<script>
const DEF={name:"каникул",date:"2026-11-29"};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ev=store.get("countdown")||DEF;
const $=id=>document.getElementById(id);
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c};
const fmtN=n=>n.toLocaleString("ru-RU");
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const target=()=>{const[y,m,d]=ev.date.split("-").map(Number);return new Date(y,m-1,d,0,0,0)};
function apply(){
  const t=target();
  $("title").innerHTML="";$("title").append("До ");const sp=document.createElement("span");sp.textContent=ev.name;$("title").append(sp," осталось");
  const wd=t.toLocaleDateString("ru-RU",{weekday:"long"});
  $("date").textContent=`${t.getDate()} ${MONTHS[t.getMonth()]} ${t.getFullYear()}, ${wd}`;
  $("evName").value=ev.name;$("evDate").value=ev.date;tick();
}
function schoolDays(from,to){let n=0;const d=new Date(from.getFullYear(),from.getMonth(),from.getDate());while(d<to){const w=d.getDay();if(w>0&&w<6)n++;d.setDate(d.getDate()+1)}return n}
let lastFun=-1;
function tick(){
  const now=new Date(),t=target(),ms=t-now;
  if(ms<=0){$("clock").hidden=true;$("fun").hidden=true;$("party").hidden=false;$("party").textContent=ev.name===DEF.name?"Ура, каникулы!":"Дождались!";return}
  $("clock").hidden=false;$("fun").hidden=false;$("party").hidden=true;
  const s=Math.floor(ms/1000),D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;
  $("d").textContent=D;$("h").textContent=String(H).padStart(2,"0");$("m").textContent=String(M).padStart(2,"0");$("s").textContent=String(S).padStart(2,"0");
  $("dl").textContent=plural(D,"день","дня","дней");$("hl").textContent=plural(H,"час","часа","часов");$("ml").textContent=plural(M,"минута","минуты","минут");$("sl").textContent=plural(S,"секунда","секунды","секунд");
  const minute=Math.floor(s/60);
  if(minute!==lastFun){lastFun=minute;
    const sd=schoolDays(now,t),weeks=Math.floor(D/7),ep=Math.floor(s/(24*60)),beats=Math.round(s/60*75);
    const items=[
      [fmtN(sd),`${plural(sd,"учебный день","учебных дня","учебных дней")} (пн–пт), считая сегодня`],
      [fmtN(weeks),`${plural(weeks,"полная неделя","полные недели","полных недель")}`],
      [fmtN(ep),`${plural(ep,"серия","серии","серий")} «Кухни», если смотреть без перерыва`],
      [fmtN(D),`${plural(D,"раз","раза","раз")} лечь спать и проснуться`],
      [fmtN(beats),`${plural(beats,"удар","удара","ударов")} сердца (примерно)`],
      [fmtN(Math.floor(s/60/45)),`${plural(Math.floor(s/60/45),"урок","урока","уроков")} по 45 минут, если идти подряд`]
    ];
    $("fun").innerHTML=items.map(()=>`<div class="f"><b></b><span></span></div>`).join("");
    $("fun").querySelectorAll(".f").forEach((el,i)=>{el.querySelector("b").textContent=items[i][0];el.querySelector("span").textContent=items[i][1]});
  }
}
$("set").addEventListener("submit",e=>{e.preventDefault();const n=$("evName").value.trim()||DEF.name,d=$("evDate").value||DEF.date;ev={name:n,date:d};store.set("countdown",ev);lastFun=-1;apply()});
$("reset").onclick=()=>{ev={...DEF};store.set("countdown",ev);lastFun=-1;apply()};
apply();setInterval(tick,1000);

// snow
const cv=$("snow"),cx=cv.getContext("2d");let flakes=[];const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;flakes=Array.from({length:Math.round(innerWidth/9)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:(Math.random()*2+.6)*d,v:(Math.random()*.6+.3)*d,w:Math.random()*6.28}))}
function snow(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle="rgba(235,243,255,.8)";
  for(const f of flakes){if(!still){f.y+=f.v;f.w+=.01;f.x+=Math.sin(f.w)*.4;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.28);cx.fill()}
  if(!still)requestAnimationFrame(snow)}
addEventListener("resize",()=>{size();if(still)snow()});size();snow();
</script>
</body>
</html>
