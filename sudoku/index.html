<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Судоку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;500;700&display=swap">
<style>[hidden]{display:none!important}body{margin:0}.home{position:relative;z-index:50;display:inline-block;margin:12px 0 0 max(16px,env(safe-area-inset-left,0px));font:700 13px system-ui,sans-serif;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;text-decoration:none}.home:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style>
<style>
/* Layout: puzzle-book page — board left, pencil case (status, tools, number pad) right; stacks on phones with a 9-key pad under the board */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#1a2232; --muted:#5f6b7d; --line:#c9d1dc; --frame:#1a2232;
  --cell:#fbfcfd; --pencil:#2f5fd0; --peer:#e6ecf6; --same:#cddbfa; --sel:#a9c1f7; --err:#d23f36; --err-bg:#fbe3e1;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#181e28; --ink:#e6ebf2; --muted:#94a0b2; --line:#2c3545; --frame:#5a6b86;
  --cell:#1c2330; --pencil:#84a8ff; --peer:#222c3c; --same:#2c3d63; --sel:#3a5796; --err:#ff7b72; --err-bg:#3d2124; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#181e28; --ink:#e6ebf2; --muted:#94a0b2; --line:#2c3545; --frame:#5a6b86;
  --cell:#1c2330; --pencil:#84a8ff; --peer:#222c3c; --same:#2c3d63; --sel:#3a5796; --err:#ff7b72; --err-bg:#3d2124; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font:400 clamp(30px,6vw,46px)/1 var(--display);margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);margin:6px 0 0;font-weight:500}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:500}
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;justify-items:center}
@media (min-width:780px){.game{grid-template-columns:minmax(0,480px) 250px;justify-content:center;align-items:start}}
.boardwrap{position:relative;width:100%;max-width:480px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--frame);padding:3px;border-radius:12px;width:100%;aspect-ratio:1;outline:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board:focus-visible{box-shadow:0 0 0 3px var(--pencil)}
.box{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);overflow:hidden}
.box:nth-child(1){border-top-left-radius:9px}.box:nth-child(3){border-top-right-radius:9px}.box:nth-child(7){border-bottom-left-radius:9px}.box:nth-child(9){border-bottom-right-radius:9px}
.cell{background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:clamp(19px,5.6vw,28px);font-weight:500;color:var(--pencil);cursor:pointer;position:relative;font-variant-numeric:tabular-nums;transition:background .1s}
.cell.given{color:var(--ink);font-weight:700}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.err{color:var(--err);background:var(--err-bg)}
.cell.sel.err{background:var(--sel)}
.cell.pop{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.18)}}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;padding:6%}
.notes span{display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1.9vw,11.5px);font-weight:500;color:var(--muted);line-height:1}
.side{display:flex;flex-direction:column;gap:14px;width:100%;max-width:480px}
.status{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 13px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 4px;cursor:pointer}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{border-color:var(--pencil);color:var(--pencil);background:var(--peer)}
.tool .onoff{font-size:10px;font-weight:700;letter-spacing:.06em}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media (min-width:780px){.pad{grid-template-columns:repeat(3,1fr);gap:8px}}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 24px var(--body);color:var(--pencil);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 0 5px;cursor:pointer;min-width:0}
@media (min-width:780px){.key{font-size:30px;padding:12px 0 8px}}
.key small{font-size:10px;color:var(--muted);font-weight:500}
.key:disabled{opacity:.3;cursor:default}
.notesOn .key{color:var(--muted)}
button:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.tool:hover,.key:not(:disabled):hover,.chip:hover{border-color:var(--ink)}
.btn{font:700 15px var(--body);border:none;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--pencil);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);border-radius:12px;padding:16px}
.wincard{background:var(--surface);border:2px solid var(--frame);border-radius:16px;padding:22px 24px;text-align:center;max-width:320px;animation:rise .4s ease-out}
@keyframes rise{from{transform:translateY(12px) scale(.96);opacity:0}}
.wincard h2{font:400 26px var(--display);margin:0 0 6px}
.wincard p{margin:4px 0;color:var(--muted)}
.wincard .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.help{color:var(--muted);font-size:14px;margin:0}
kbd{font:500 12px var(--body);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="home" href="../">← На главную</a>
<main class="wrap">
  <header>
    <div><h1>Судоку</h1><p class="tag">81 клетка, 9 цифр, ровно одно решение</p></div>
    <div class="levels" role="group" aria-label="Сложность" id="levels"></div>
  </header>
  <div class="confirm" id="confirm" hidden><span id="confirmText">Начать новую игру? Текущая пропадёт.</span>
    <button class="btn" id="yes">Да, новая</button><button class="btn ghost" id="no">Продолжить эту</button></div>
  <section class="game">
    <div class="boardwrap">
      <div class="board" id="board" tabindex="0" aria-label="Поле судоку"></div>
      <div class="win" id="win" hidden></div>
    </div>
    <div class="side" id="side">
      <div class="status">
        <div class="stat"><small>Уровень</small><b id="sLevel">—</b></div>
        <div class="stat"><small>Ошибки</small><b id="sMist">0</b></div>
        <div class="stat"><small>Время</small><b id="sTime">0:00</b></div>
      </div>
      <div class="tools">
        <button class="tool" id="tUndo" title="Отменить ход (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Отмена</button>
        <button class="tool" id="tErase" title="Стереть (Backspace)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7M5 11l9 9"/></svg>Стереть</button>
        <button class="tool" id="tNotes" aria-pressed="false" title="Заметки карандашом (N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg><span>Заметки <span class="onoff" id="notesState">ВЫКЛ</span></span></button>
        <button class="tool" id="tHint" title="Подсказка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Подсказка</button>
      </div>
      <div class="pad" id="pad"></div>
      <p class="help">Выбери клетку и нажми цифру. На клавиатуре: <kbd>1</kbd>–<kbd>9</kbd>, стрелки, <kbd>Backspace</kbd>, <kbd>N</kbd> для заметок.</p>
    </div>
  </section>
</main>

<script>
const LV={easy:["Лёгкий",40],medium:["Средний",32],hard:["Сложный",26]};
const ROW=i=>Math.floor(i/9),COL=i=>i%9,BOX=i=>Math.floor(ROW(i)/3)*3+Math.floor(COL(i)/3);
const PEERS=[...Array(81)].map((_,i)=>{const a=[];for(let j=0;j<81;j++)if(j!==i&&(ROW(j)===ROW(i)||COL(j)===COL(i)||BOX(j)===BOX(i)))a.push(j);return a});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pc=m=>{let n=0;while(m){m&=m-1;n++}return n};
function cand(g,i){let m=0;for(const j of PEERS[i])if(g[j])m|=1<<g[j];return ~m&0x3FE}
function pick(g){let best=-1,bm=0,bn=10;for(let i=0;i<81;i++)if(!g[i]){const m=cand(g,i),n=pc(m);if(n<bn){bn=n;best=i;bm=m;if(!n)break}}return[best,bm,bn]}
function count(g,limit){const[b,m,n]=pick(g);if(b<0)return 1;if(!n)return 0;let c=0;for(let d=1;d<=9;d++)if(m&1<<d){g[b]=d;c+=count(g,limit-c);g[b]=0;if(c>=limit)break}return c}
function fill(g){const[b,m]=pick(g);if(b<0)return true;for(const d of shuffle([1,2,3,4,5,6,7,8,9]))if(m&1<<d){g[b]=d;if(fill(g))return true;g[b]=0}return false}
function generate(lv){const sol=Array(81).fill(0);fill(sol);const p=sol.slice();let n=81;
  for(const i of shuffle([...Array(81).keys()])){if(n<=LV[lv][1])break;const t=p[i];p[i]=0;if(count(p,2)!==1)p[i]=t;else n--}
  return{sol,p}}

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=null,notesMode=false,pendingLevel=null;
const $=id=>document.getElementById(id);
const board=$("board"),cells=[];
for(let b=0;b<9;b++){const box=document.createElement("div");box.className="box";
  for(let k=0;k<9;k++){const r=Math.floor(b/3)*3+Math.floor(k/3),c=(b%3)*3+k%3,i=r*9+c;
    const el=document.createElement("div");el.className="cell";el.dataset.i=i;cells[i]=el;box.appendChild(el)}
  board.appendChild(box)}
board.addEventListener("pointerdown",e=>{const el=e.target.closest(".cell");if(!el)return;S.sel=+el.dataset.i;render()});

const pad=$("pad");
for(let d=1;d<=9;d++){const b=document.createElement("button");b.className="key";b.dataset.d=d;b.innerHTML=`${d}<small></small>`;b.onclick=()=>input(d);pad.appendChild(b)}

function renderLevels(){
  $("levels").innerHTML=Object.entries(LV).map(([k,[n]])=>`<button class="chip" data-l="${k}" aria-pressed="${S&&S.lv===k}">${n}</button>`).join("")+`<button class="chip" data-l="again">Новая игра</button>`;
  $("levels").querySelectorAll(".chip").forEach(b=>b.onclick=()=>askNew(b.dataset.l==="again"?S.lv:b.dataset.l));
}
function askNew(lv){
  if(!S||S.done||!S.hist.length){newGame(lv);return}
  pendingLevel=lv;$("confirmText").textContent=`Начать новую игру (${LV[lv][0].toLowerCase()})? Текущая пропадёт.`;$("confirm").hidden=false;
}
$("yes").onclick=()=>{$("confirm").hidden=true;newGame(pendingLevel)};
$("no").onclick=()=>{$("confirm").hidden=true};

function newGame(lv){
  const{sol,p}=generate(lv);
  S={lv,sol,given:p,vals:p.slice(),notes:Array(81).fill(0),sel:p.indexOf(0),mist:0,hints:0,t:0,hist:[],done:false};
  $("win").hidden=true;save();renderLevels();render();board.focus({preventScroll:true});
}
function save(){store.set("sudoku-game",{...S,hist:S.hist.slice(-30)})}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

function render(flash){
  const sel=S.sel,sv=sel>=0?S.vals[sel]:0;
  cells.forEach((el,i)=>{
    const v=S.vals[i],g=S.given[i];
    let c="cell";
    if(g)c+=" given";
    if(i===sel)c+=" sel";
    else if(sv&&v===sv)c+=" same";
    else if(sel>=0&&(ROW(i)===ROW(sel)||COL(i)===COL(sel)||BOX(i)===BOX(sel)))c+=" peer";
    if(v&&!g&&v!==S.sol[i])c+=" err";
    if(flash===i)c+=" pop";
    el.className=c;
    if(v)el.textContent=v;
    else if(S.notes[i]){let h='<div class="notes">';for(let d=1;d<=9;d++)h+=`<span>${S.notes[i]&1<<d?d:""}</span>`;el.innerHTML=h+"</div>"}
    else el.textContent="";
  });
  pad.querySelectorAll(".key").forEach(k=>{const d=+k.dataset.d;let n=0;for(let i=0;i<81;i++)if(S.vals[i]===d&&S.sol[i]===d)n++;
    k.querySelector("small").textContent=9-n?`ещё ${9-n}`:"готово";k.disabled=n===9||S.done});
  $("sLevel").textContent=LV[S.lv][0];$("sMist").textContent=S.mist;$("sTime").textContent=fmt(S.t);
  $("tNotes").setAttribute("aria-pressed",notesMode);$("notesState").textContent=notesMode?"ВКЛ":"ВЫКЛ";
  $("side").classList.toggle("notesOn",notesMode);
}
function push(){S.hist.push([S.vals.slice(),S.notes.slice()]);if(S.hist.length>200)S.hist.shift()}
function input(d){
  const i=S.sel;if(S.done||i<0||S.given[i])return;
  if(notesMode){if(S.vals[i])return;push();S.notes[i]^=1<<d}
  else{push();
    if(S.vals[i]===d)S.vals[i]=0;
    else{S.vals[i]=d;S.notes[i]=0;if(d!==S.sol[i])S.mist++;else PEERS[i].forEach(j=>S.notes[j]&=~(1<<d))}}
  after(i);
}
function erase(){const i=S.sel;if(S.done||i<0||S.given[i]||(!S.vals[i]&&!S.notes[i]))return;push();S.vals[i]=0;S.notes[i]=0;after()}
function undo(){if(S.done||!S.hist.length)return;[S.vals,S.notes]=S.hist.pop();after()}
function hint(){
  if(S.done)return;let i=S.sel;
  if(i<0||S.given[i]||S.vals[i]===S.sol[i]){const open=[];for(let k=0;k<81;k++)if(S.vals[k]!==S.sol[k])open.push(k);if(!open.length)return;i=open[Math.floor(Math.random()*open.length)]}
  push();S.vals[i]=S.sol[i];S.notes[i]=0;PEERS[i].forEach(j=>S.notes[j]&=~(1<<S.sol[i]));S.hints++;S.sel=i;after(i);
}
function after(flash){
  if(S.vals.every((v,i)=>v===S.sol[i])){S.done=true;win()}
  save();render(flash);
}
function win(){
  const best=store.get("sudoku-best")||{};const prev=best[S.lv];const rec=!prev||S.t<prev;if(rec){best[S.lv]=S.t;store.set("sudoku-best",best)}
  const w=$("win");
  w.innerHTML=`<div class="wincard"><h2>Решено!</h2>
    <p>${LV[S.lv][0]} уровень за <b>${fmt(S.t)}</b></p>
    <p>Ошибок: ${S.mist} · подсказок: ${S.hints}</p>
    <p>${rec?"Это твой новый рекорд!":`Рекорд: ${fmt(prev)}`}</p>
    <div class="row"><button class="btn" id="wNew">Ещё одну</button>${S.lv!=="hard"?`<button class="btn ghost" id="wHarder">Посложнее</button>`:""}</div></div>`;
  w.hidden=false;
  $("wNew").onclick=()=>newGame(S.lv);
  const h=$("wHarder");if(h)h.onclick=()=>newGame(S.lv==="easy"?"medium":"hard");
}
$("tUndo").onclick=undo;$("tErase").onclick=erase;$("tHint").onclick=hint;
$("tNotes").onclick=()=>{notesMode=!notesMode;render()};

document.addEventListener("keydown",e=>{
  if(!S)return;const k=e.key;
  if((e.ctrlKey||e.metaKey)&&(k==="z"||k==="я")){e.preventDefault();undo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-9]$/.test(k)){input(+k);return}
  if(k==="Backspace"||k==="Delete"||k==="0"){e.preventDefault();erase();return}
  if(k==="n"||k==="N"||k==="т"||k==="Т"){notesMode=!notesMode;render();return}
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];
  if(mv!==undefined){e.preventDefault();let i=S.sel<0?40:S.sel;
    if(mv===-1&&COL(i)>0)i--;else if(mv===1&&COL(i)<8)i++;else if(mv===-9&&ROW(i)>0)i-=9;else if(mv===9&&ROW(i)<8)i+=9;
    S.sel=i;render()}
});

setInterval(()=>{if(S&&!S.done&&!document.hidden){S.t++;$("sTime").textContent=fmt(S.t);if(S.t%5===0)save()}},1000);

(function boot(){
  const g=store.get("sudoku-game");
  if(g&&!g.done&&Array.isArray(g.vals)&&g.vals.length===81&&LV[g.lv]){S={...g,hist:g.hist||[]};renderLevels();render()}
  else newGame("easy");
})();
</script>
</body>
</html>
