<style>[hidden]{display:none!important}body{margin:0}.home{position:relative;z-index:50;display:inline-block;margin:12px 0 0 max(16px,env(safe-area-inset-left,0px));font:700 13px system-ui,sans-serif;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;text-decoration:none}.home:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style>
<style>
/* Layout: sticker-board of colored test tiles; one test fills the page as a big card, one question at a time */
:root{
  --bg:#eef3ec; --surface:#ffffff; --ink:#1d2420; --muted:#5d6b63; --line:#d3ddd5; --accent:#ff5a36;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tile-l:88%; --tile-c:0.09; --tile-ink:#1d2420;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1e2622; --ink:#eef3ef; --muted:#9aa9a0; --line:#2f3a34; --accent:#ff7a5c;
  --tile-l:34%; --tile-c:0.08; --tile-ink:#f3f6f4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1e2622; --ink:#eef3ef; --muted:#9aa9a0; --line:#2f3a34; --accent:#ff7a5c;
  --tile-l:34%; --tile-c:0.08; --tile-ink:#f3f6f4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,64px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:8px 0 0;max-width:46ch;font-weight:700}
.btn{font:800 15px var(--body);border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .12s, box-shadow .12s;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stats{font-weight:800;color:var(--muted);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:800 14px var(--body);border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{position:relative;text-align:left;border:2px solid var(--ink);border-radius:18px;padding:18px 18px 16px;cursor:pointer;
  background:oklch(var(--tile-l) var(--tile-c) var(--h));color:var(--tile-ink);font-family:var(--body);
  display:flex;flex-direction:column;gap:8px;min-height:168px;transition:transform .15s}
.tile:nth-child(3n+1){transform:rotate(-.6deg)} .tile:nth-child(3n+2){transform:rotate(.5deg)}
.tile:hover{transform:rotate(0) translateY(-3px)}
.tag{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.tile h3{font:700 19px/1.15 var(--display);margin:0;text-wrap:balance}
.tile p{margin:0;font-size:14px;font-weight:700;opacity:.8}
.done{margin-top:auto;font-size:13px;font-weight:800;background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;align-self:flex-start;border:1.5px solid var(--ink)}
.play{max-width:680px;margin:0 auto}
.card{border:2px solid var(--ink);border-radius:22px;background:var(--surface);box-shadow:6px 6px 0 oklch(var(--tile-l) var(--tile-c) var(--h));padding:24px clamp(18px,4vw,34px) 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{background:none;border:none;color:var(--muted);font:800 15px var(--body);cursor:pointer;padding:4px 0}
.back:hover{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:oklch(62% .17 var(--h));transition:width .3s}
.count{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font:700 clamp(20px,4vw,26px)/1.2 var(--display);margin:14px 0 20px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:700 16px var(--body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover{border-color:var(--ink)}
.opt.right{background:oklch(85% .14 150);border-color:oklch(50% .14 150);color:#13321d}
.opt.wrong{background:oklch(86% .1 25);border-color:oklch(55% .17 25);color:#3d1410}
.opt:disabled{cursor:default}
.note{margin-top:14px;font-weight:700;color:var(--muted);min-height:1.5em}
.res-kicker{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res-name{font:900 clamp(30px,7vw,48px)/1 var(--display);margin:10px 0 14px;color:oklch(55% .17 var(--h));text-wrap:balance}
.res-text{font-size:17px;max-width:58ch;margin:0 0 22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .res-name{color:oklch(78% .14 var(--h))}}
:root[data-theme="dark"] .res-name{color:oklch(78% .14 var(--h))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tile{transform:none!important}}
</style>
</head>

const app=document.getElementById("app");
let filter="all";
const saved=(()=>{try{return JSON.parse(localStorage.getItem("testoteka")||"{}")}catch(e){return{}}})();
function save(){try{localStorage.setItem("testoteka",JSON.stringify(saved))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function home(){
  const doneN=T.filter(t=>saved[t.id]).length;
  const list=T.filter(t=>filter==="all"||(filter==="p"?t.kind==="p":t.kind==="t"));
  app.innerHTML=`<header><div><h1>Тесто<span>тека</span></h1>
  <p class="lead">19 тестов, чтобы урок прошёл быстрее. Выбирай любой или жми на случайный.</p></div>
  <div class="row" style="align-items:center"><span class="stats">Пройдено ${doneN} из ${T.length}</span>
  <button class="btn primary" id="rnd">Случайный тест</button></div></header>
  <div class="filters" role="group" aria-label="Фильтр">
   ${[["all","Все"],["p","Кто ты?"],["t","Викторины"]].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}
  </div>
  <div class="grid">${list.map(t=>`<button class="tile" data-id="${t.id}" style="--h:${t.h}">
    <span class="tag">${t.tag} · ${t.q.length} вопр.</span><h3>${esc(t.title)}</h3><p>${esc(t.sub)}</p>
    ${saved[t.id]?`<span class="done">Твой результат: ${esc(saved[t.id])}</span>`:""}</button>`).join("")}</div>`;
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>start(T.find(t=>t.id===b.dataset.id)));
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;home()});
  app.querySelector("#rnd").onclick=()=>{const left=T.filter(t=>!saved[t.id]);const pool=left.length?left:T;start(pool[Math.floor(Math.random()*pool.length)])};
  window.scrollTo(0,0);
}

function start(t){
  const st={t,i:0,tally:[0,0,0,0],score:0,order:t.q.map(q=>shuffle(q[1].map((_,k)=>k)))};
  question(st);window.scrollTo(0,0);
}

function frame(st,inner){
  const t=st.t;
  app.innerHTML=`<div class="play" style="--h:${t.h}"><div class="card">
   <div class="top"><button class="back" id="back">← Все тесты</button><span class="count">${esc(t.title)}</span></div>${inner}</div></div>`;
  app.querySelector("#back").onclick=home;
}

function question(st){
  const t=st.t,[text,opts]=t.q[st.i];
  frame(st,`<div class="bar"><i style="width:${st.i/t.q.length*100}%"></i></div>
   <div class="count">Вопрос ${st.i+1} из ${t.q.length}</div>
   <h2 class="q">${esc(text)}</h2>
   <div class="opts">${st.order[st.i].map(k=>`<button class="opt" data-k="${k}">${esc(opts[k])}</button>`).join("")}</div>
   <div class="note" id="note"></div>`);
  const btns=app.querySelectorAll(".opt");
  btns[0].focus({preventScroll:true});
  btns.forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(t.kind==="p"){st.tally[k]++;next(st);return}
    btns.forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add("right")});
    const note=app.querySelector("#note");
    if(k===0){st.score++;note.textContent="Верно!"}else{b.classList.add("wrong");note.textContent="Мимо! Правильный ответ подсвечен зелёным."}
    setTimeout(()=>next(st),1100);
  });
}

function next(st){st.i++; st.i<st.t.q.length?question(st):result(st)}

function result(st){
  const t=st.t;let name,text,kicker;
  if(t.kind==="p"){
    const m=Math.max(...st.tally);const idx=st.tally.indexOf(m);[name,text]=t.r[idx];kicker="Твой результат";
  }else{
    const f=st.score/t.q.length;let tier=t.r[0];t.r.forEach(r=>{if(f>=r[0])tier=r});
    name=tier[1];text=tier[2];kicker=`${st.score} из ${t.q.length} правильно`;
  }
  saved[t.id]=t.kind==="p"?name:`${name} (${st.score}/${t.q.length})`;save();
  const others=T.filter(x=>x.id!==t.id&&!saved[x.id]);
  frame(st,`<div class="bar"><i style="width:100%"></i></div>
   <p class="res-kicker" style="margin-top:18px">${esc(kicker)}</p>
   <h2 class="res-name">${esc(name)}</h2><p class="res-text">${esc(text)}</p>
   <div class="row"><button class="btn primary" id="nx">${others.length?"Следующий тест":"Все тесты пройдены!"}</button>
   <button class="btn" id="again">Пройти ещё раз</button></div>`);
  app.querySelector("#again").onclick=()=>start(t);
  app.querySelector("#nx").onclick=()=>others.length?start(others[Math.floor(Math.random()*others.length)]):home();
}

home();
</script>
