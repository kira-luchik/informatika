<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои развлекалки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#eef3ec;--ink:#1d2420;--muted:#5d6b63;--accent:#ff5a36;--a:#ffd9c9;--b:#1c2638;--b-ink:#ece4d2}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--ink:#eef3ef;--muted:#9aa9a0;--a:#5a2e22;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center}
main{max-width:860px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px));width:100%}
h1{font:900 clamp(36px,8vw,64px)/1 "Unbounded",system-ui,sans-serif;margin:0 0 10px}
h1 span{color:var(--accent)}
p.lead{color:var(--muted);font-weight:600;margin:0 0 28px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
a.card{display:flex;flex-direction:column;gap:8px;padding:26px;border-radius:20px;border:2px solid var(--ink);text-decoration:none;min-height:170px;transition:transform .15s}
a.card:hover{transform:translateY(-4px)}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.t{background:var(--a);color:var(--ink)}
.r{background:var(--b);color:var(--b-ink)}
.card b{font:700 24px/1.1 "Unbounded",system-ui,sans-serif}
.card span{font-weight:600;opacity:.85}
.card i{margin-top:auto;font-style:normal;font-weight:800}
</style>
</head>
<body>
<main>
  <h1>Мои <span>развлекалки</span></h1>
  <p class="lead">Чтобы урок прошёл быстрее.</p>
  <div class="grid">
    <a class="card t" href="tests/"><b>Тестотека</b><span>15 тестов: «Кухня», какое ты мороженое, какой ты кот и другие</span><i>Открыть →</i></a>
    <a class="card r" href="tarot/"><b>Три карты Таро</b><span>Загадай вопрос и вытяни три карты со значениями</span><i>Открыть →</i></a>
  </div>
</main>
</body>
</html>
